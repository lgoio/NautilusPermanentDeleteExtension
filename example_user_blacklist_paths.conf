# Nautilus Permanent Delete Extension
# User blacklist rules
#
# Copy this file to:
#
#   ~/.config/nautilus-permanent-delete-extension/user_blacklist_paths.conf
#
# One path or pattern per line.
# Lines starting with # are ignored.
#
# Matching paths require an additional confirmation before they can
# be permanently deleted.
#
# Whitelist rules override blacklist rules.
#
# Pattern rules:
#
#   ~/Photos
#     Match only this exact path.
#
#   ~/git/*
#     Match ~/git and all direct children of ~/git.
#
#   ~/git/**
#     Match ~/git and everything below it recursively.
#
#   ~/Downloads/*.zip
#     Match ZIP files directly inside ~/Downloads.

# Uncomment or add your own entries below.

# ~/Photos
# /mnt/backup
# ~/git/*
# ~/git/**
# ~/Downloads/*.zip