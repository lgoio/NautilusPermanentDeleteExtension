# Nautilus Permanent Delete Extension
# User whitelist rules
#
# Copy this file to:
#
#   ~/.config/nautilus-permanent-delete-extension/user_whitelist_paths.conf
#
# One path or pattern per line.
# Lines starting with # are ignored.
#
# Matching paths bypass blacklist rules and are deleted immediately
# without showing the delete confirmation dialog.
#
# Whitelist rules override blacklist rules.
#
# Pattern rules:
#
#   ~/Downloads
#     Match only this exact path.
#
#   ~/Downloads/*
#     Match ~/Downloads and all direct children of ~/Downloads.
#
#   ~/Downloads/**
#     Match ~/Downloads and everything below it recursively.
#
#   ~/Downloads/*.zip
#     Match ZIP files directly inside ~/Downloads.
#
# Examples:
#
#   ~/Downloads/*.zip
#   /mnt/test/**
#   ~/tmp/**
#   /tmp/**
#
# Uncomment or add your own entries below.

# ~/Downloads/*.zip
# /mnt/test/**